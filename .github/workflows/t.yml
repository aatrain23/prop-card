name: kalshi test
on: { push: { branches: [kalshi-test] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo '{"games":[]}' > /tmp/prev.json && python3 tools/cfb_gameday.py /tmp/prev.json gameday.json 2>&1 | tee log.txt
      - run: git -c user.name=bot -c user.email=a@b add gameday.json log.txt && git -c user.name=bot -c user.email=a@b commit -qm out && git push -q
