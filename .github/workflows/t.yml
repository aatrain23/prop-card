name: kalshi test
on: { push: { branches: [kalshi-test] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo '{}' > /tmp/prev.json && DRY_RUN=1 python3 tools/bet_alerts.py /tmp/prev.json state.json 2>&1 | tee log.txt
      - run: git -c user.name=bot -c user.email=a@b add state.json log.txt && git -c user.name=bot -c user.email=a@b commit -qm out && git push -q
